name: Java CI with Maven

on:
  push:
    branches: [ "Project-4-Todo" ]
  pull_request:
    branches: [ "Project-4-Todo" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven
    - name: Build with Maven
      run: mvn -B package --file pom.xml
